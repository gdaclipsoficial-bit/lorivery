plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.chatbox"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            keyAlias = "lorivery"
            keyPassword = "lorivery2024"
            storeFile = file("lorivery-release.jks")
            storePassword = "lorivery2024"
        }
    }

    flavorDimensions "app"

    productFlavors {
        client {
            dimension "app"
            applicationIdSuffix ".client"
            versionNameSuffix "-client"
        }
        courier {
            dimension "app"
            applicationIdSuffix ".courier"
            versionNameSuffix "-courier"
        }
    }

    defaultConfig {
        applicationId = "com.example.chatbox"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
